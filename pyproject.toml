[project]
name = "learnpath-ai-agent"
version = "2.0.0"
description = "Multi-Agent Personalized Adaptive Learning Platform for PromptWars x AgentX 2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask==3.0.3",
    "flask-cors==4.0.1",
    "python-dotenv==1.0.1",
    "werkzeug==3.0.3",
    "itsdangerous==2.2.0",
    "requests==2.32.3",
    "fpdf2==2.8.2",
    "openai>=1.0.0",
    "google-search-results==2.4.2",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["venv", ".venv", "__pycache__", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
[project]
name = "learnpath-ai-agent"
version = "2.0.0"
description = "Multi-Agent Personalized Adaptive Learning Platform for PromptWars x AgentX 2.0"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["venv", ".venv", "__pycache__", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]